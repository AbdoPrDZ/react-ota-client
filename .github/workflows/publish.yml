# Publishes the package to npm when a GitHub release is published.
#
# Authentication is npm trusted publishing (OIDC): no npm token is stored in
# GitHub. One-time setup on npmjs.com: package → Settings → Trusted publishing
# → GitHub Actions, with this repository and the workflow file name
# `publish.yml`. Provenance is attached automatically.
#
# Release flow:
#   1. Bump "version" in package.json and LIBRARY_VERSION in
#      android/build.gradle, add the CHANGELOG entry; push.
#   2. Create a GitHub release with the tag v<version> (e.g. v1.5.1).
#   A version with a pre-release part (1.6.0-beta.1) is published under the
#   `next` dist-tag instead of `latest`.

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@11

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Check LIBRARY_VERSION matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LINE=$(grep LIBRARY_VERSION android/build.gradle)
          case "$LINE" in
            *"\"$VERSION\\\""*) ;;
            *)
              echo "::error::LIBRARY_VERSION in android/build.gradle is not $VERSION: $LINE"
              exit 1
              ;;
          esac

      - name: Skip if this version is already on npm
        id: exists
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already published; nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # `prepare` builds dist/ during install.
      - name: Install
        if: steps.exists.outputs.published != 'true'
        run: npm ci

      # `prepublishOnly` runs the typecheck first.
      - name: Publish
        if: steps.exists.outputs.published != 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            *)   DIST_TAG=latest ;;
          esac
          npm publish --access public --tag "$DIST_TAG"
