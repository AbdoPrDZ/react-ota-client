buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20"
  }
}

/**
 * Reads an SDK/version override from the host project (`rootProject.ext`),
 * falling back to this library's own `gradle.properties` defaults, so the module
 * compiles both when autolinked into a React Native app and when built alone.
 */
def resolveExt(String name, Object fallback) {
  if (rootProject.ext.has(name)) {
    return rootProject.ext.get(name)
  }

  def override = project.properties["OtaClient_${name}"]
  return override != null ? override : fallback
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
  namespace "com.otaclient"
  compileSdk resolveExt("compileSdkVersion", 36) as Integer

  defaultConfig {
    minSdk resolveExt("minSdkVersion", 24) as Integer
    targetSdk resolveExt("targetSdkVersion", 36) as Integer

    buildConfigField "String", "LIBRARY_VERSION", "\"1.0.0\""

    consumerProguardFiles "consumer-rules.pro"
  }

  buildFeatures {
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  lint {
    abortOnError false
    checkReleaseBuilds false
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // Resolved from the host app's React Native version by the React Native Gradle plugin.
  implementation("com.facebook.react:react-android")

  implementation "androidx.annotation:annotation:1.9.1"
  implementation "androidx.appcompat:appcompat:1.7.1"
  implementation "androidx.core:core-ktx:1.15.0"
  implementation "androidx.activity:activity-ktx:1.10.1"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"

  implementation "com.google.code.gson:gson:2.11.0"
  implementation "org.apache.commons:commons-compress:1.27.1"

  implementation "io.ktor:ktor-client-core:2.3.13"
  implementation "io.ktor:ktor-client-cio:2.3.13"
  implementation "io.ktor:ktor-client-content-negotiation:2.3.13"
  implementation "io.ktor:ktor-serialization-gson:2.3.13"

  testImplementation "junit:junit:4.13.2"
}
